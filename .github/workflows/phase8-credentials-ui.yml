name: Phase 8 Credentials UI Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch enumerator credentials UI
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/EnumeratorsView.tsx')
          text = path.read_text()

          state_anchor = "  const [copiedLink, setCopiedLink] = useState(false);\n"
          state_insert = state_anchor + "  const [generatedCredentials, setGeneratedCredentials] = useState<{ name: string; email: string; password: string } | null>(null);\n"
          if "generatedCredentials" not in text:
              if state_anchor not in text:
                  raise SystemExit('State anchor not found')
              text = text.replace(state_anchor, state_insert, 1)

          success_anchor = "      const payload = await response.json().catch(() => ({}));\n      if (!response.ok) throw new Error(payload.error || 'Unable to register enumerator.');\n"
          success_insert = success_anchor + "      if (payload.temporaryPassword) {\n        setGeneratedCredentials({\n          name: newName.trim(),\n          email: newEmail.trim().toLowerCase(),\n          password: payload.temporaryPassword,\n        });\n      }\n"
          if "setGeneratedCredentials({" not in text:
              if success_anchor not in text:
                  raise SystemExit('Success anchor not found')
              text = text.replace(success_anchor, success_insert, 1)

          modal = '''\n      {generatedCredentials && (\n        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-[#002045]/50 backdrop-blur-sm">\n          <div className="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-[#c4c6cf]/60 overflow-hidden">\n            <div className="bg-[#1a365d] text-white p-5">\n              <h3 className="text-lg font-bold">Enumerator Login Credentials</h3>\n              <p className="text-xs text-white/80 mt-1">Give these credentials securely to the enumerator.</p>\n            </div>\n            <div className="p-5 space-y-4">\n              <div>\n                <p className="text-xs font-bold text-[#74777f]">Enumerator</p>\n                <p className="text-sm font-semibold text-[#002045]">{generatedCredentials.name}</p>\n              </div>\n              <div>\n                <p className="text-xs font-bold text-[#74777f]">Login email</p>\n                <p className="text-sm font-semibold text-[#002045] break-all">{generatedCredentials.email}</p>\n              </div>\n              <div>\n                <p className="text-xs font-bold text-[#74777f]">Temporary password</p>\n                <div className="mt-1 p-3 rounded-lg bg-[#f1f3ff] border border-[#c4c6cf] font-mono text-sm font-bold text-[#002045] select-all break-all">\n                  {generatedCredentials.password}\n                </div>\n              </div>\n              <p className="text-xs text-[#43474e] leading-relaxed">This password is temporary. The enumerator should change it after signing in.</p>\n              <button\n                type="button"\n                onClick={() => setGeneratedCredentials(null)}\n                className="w-full py-2.5 rounded-lg bg-[#006a68] hover:bg-[#004f4e] text-white text-sm font-bold"\n              >\n                Done\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n'''

          marker = "  );\n};"
          if "Enumerator Login Credentials" not in text:
              index = text.rfind(marker)
              if index == -1:
                  raise SystemExit('Component end marker not found')
              text = text[:index] + modal + text[index:]

          path.write_text(text)
      - name: Commit UI patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EnumeratorsView.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: show enumerator login credentials"
          git push origin main
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/phase8-credentials-ui.yml || true
          git commit -m "chore: remove temporary credentials ui patch workflow" || true
          git push origin main || true
