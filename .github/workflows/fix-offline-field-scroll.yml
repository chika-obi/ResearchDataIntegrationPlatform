name: Fix Offline Field Terminal Scrolling

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'fix: enable offline field terminal scrolling'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch field terminal scroll container
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old_main = """            currentSection === 'questionnaires' || currentSection === 'offline-collector'\n              ? 'overflow-hidden pb-16 md:pb-0'\n              : 'overflow-y-auto pb-20 md:pb-8'"""
          new_main = """            currentSection === 'questionnaires'\n              ? 'overflow-hidden pb-16 md:pb-0'\n              : 'overflow-y-auto pb-20 md:pb-8'"""

          if old_main not in text:
              raise SystemExit('Expected main-content overflow block was not found; stopping without changes.')
          text = text.replace(old_main, new_main, 1)

          old_container = """            currentSection === 'questionnaires' || currentSection === 'offline-collector'\n                ? 'h-full flex flex-col min-w-0 overflow-hidden'\n                : 'w-full max-w-[1440px] mx-auto px-3.5 py-4 sm:px-6 sm:py-6 md:px-8 md:py-8 lg:px-10 lg:py-8 space-y-4 sm:space-y-6 md:space-y-8'"""
          new_container = """            currentSection === 'questionnaires'\n                ? 'h-full flex flex-col min-w-0 overflow-hidden'\n                : 'w-full max-w-[1440px] mx-auto px-3.5 py-4 sm:px-6 sm:py-6 md:px-8 md:py-8 lg:px-10 lg:py-8 space-y-4 sm:space-y-6 md:space-y-8'"""

          if old_container not in text:
              raise SystemExit('Expected responsive container overflow block was not found; stopping without changes.')
          text = text.replace(old_container, new_container, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/fix-offline-field-scroll.yml
          git rm .github/workflows/fix-offline-field-scroll.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: enable offline field terminal scrolling"
          git push
