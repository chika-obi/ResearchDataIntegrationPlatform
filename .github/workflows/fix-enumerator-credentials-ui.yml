name: Fix Enumerator Credentials UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'chore: patch enumerator credentials UI flow'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch credentials success state
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/EnumeratorsView.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''      if (payload.temporaryPassword) {\n        setGeneratedCredentials({\n          name: newName.trim(),\n          email: newEmail.trim().toLowerCase(),\n          password: payload.temporaryPassword,\n        });\n      }\n\n'''
          new = '''      const credentials = payload.temporaryPassword\n        ? {\n            name: newName.trim(),\n            email: newEmail.trim().toLowerCase(),\n            password: payload.temporaryPassword,\n          }\n        : null;\n\n'''
          if old not in text:
              raise SystemExit('Expected credentials block was not found; stopping without changes.')
          text = text.replace(old, new, 1)

          old2 = '''      setIsAssignModalOpen(false);\n      setNewName('');\n      setNewEmail('');\n      setNewPhone('');\n      setNewProjectId('');\n      setMessageToast(payload.message || `Enumerator ${newEnum.name} registered successfully.`);\n      setTimeout(() => setMessageToast(null), 4000);\n'''
          new2 = '''      setIsAssignModalOpen(false);\n      setNewName('');\n      setNewEmail('');\n      setNewPhone('');\n      setNewProjectId('');\n\n      if (credentials) {\n        // Show the one-time credentials as the primary success state.\n        // The password is returned by the server and is not persisted.\n        setGeneratedCredentials(credentials);\n      } else {\n        setMessageToast(payload.message || `Enumerator ${newEnum.name} registered successfully.`);\n        setTimeout(() => setMessageToast(null), 4000);\n      }\n'''
          if old2 not in text:
              raise SystemExit('Expected success-state block was not found; stopping without changes.')
          text = text.replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EnumeratorsView.tsx .github/workflows/fix-enumerator-credentials-ui.yml
          git rm .github/workflows/fix-enumerator-credentials-ui.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: reliably show enumerator credentials after provisioning"
          git push
